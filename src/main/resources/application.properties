spring.application.name=RateShield

# Database configuration with environment variable support
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rateshield}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# RateShield Token Bucket Defaults
rateshield.rate-limit.capacity=5
rateshield.rate-limit.refill-tokens-per-second=1.0
rateshield.rate-limit.max-clients=10000
rateshield.rate-limit.idle-ttl-seconds=1800

# RateShield JWT Security Configuration (environment variable with validation)
rateshield.jwt.secret=${JWT_SECRET:${RATESHIELD_JWT_SECRET:}}
rateshield.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# RateShield CORS Configuration
rateshield.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Safe local-development configuration (git-ignored)
spring.config.import=optional:file:./local.properties,optional:classpath:local.properties