spring.application.name=RateShield

# Database configuration with environment variable support (Aiven Cloud MySQL defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-27ea6975-sudikshachiduruppa-3984.g.aivencloud.com:17038/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# HikariCP connection pool settings for cloud database stability
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# RateShield Token Bucket Defaults
rateshield.rate-limit.capacity=5
rateshield.rate-limit.refill-tokens-per-second=1.0
rateshield.rate-limit.max-clients=10000
rateshield.rate-limit.idle-ttl-seconds=1800

# RateShield JWT Security Configuration (environment variable with validation)
rateshield.jwt.secret=${JWT_SECRET:${RATESHIELD_JWT_SECRET:}}
rateshield.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

# RateShield CORS Configuration
rateshield.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Safe local-development configuration (git-ignored)
spring.config.import=optional:file:./local.properties,optional:classpath:local.properties